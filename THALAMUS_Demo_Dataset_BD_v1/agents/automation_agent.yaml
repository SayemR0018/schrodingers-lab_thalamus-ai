agent:
  id: "automation_agent"
  name: "Automation Agent"
  status: "locked"
  purpose: "Convert approved agent recommendations into controlled workflow actions."

  inputs:
    - sales_findings
    - marketing_findings
    - inventory_findings
    - customer_success_findings
    - finance_findings
    - business_policies

  capabilities:
    - create_restock_request
    - prepare_customer_message
    - create_follow_up_task
    - prepare_marketing_task

  safety:
    destructive_actions_require_approval: true
    external_messages_require_approval: true
    financial_actions_require_approval: true

  example_workflows:
    - trigger: "stockout_risk"
      action: "prepare_restock_request"
    - trigger: "delivery_issue_cluster"
      action: "prepare_customer_notification"
    - trigger: "sales_decline"
      action: "prepare_marketing_review"

  note: "Keep locked in the prototype UI until explicitly enabled."
