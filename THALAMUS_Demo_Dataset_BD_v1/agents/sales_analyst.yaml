agent:
  id: "sales_analyst"
  name: "Sales Analyst"
  status: "active"
  purpose: "Analyze sales performance, revenue trends, products, customers, and sellers."

  data_sources:
    - orders
    - order_items
    - products
    - customers
    - sellers
    - payments

  capabilities:
    - monthly_revenue_analysis
    - product_performance
    - seller_performance
    - average_order_value
    - order_volume_trends
    - customer_purchase_trends

  example_questions:
    - "Why did sales decline this month?"
    - "Which products generated the most revenue?"
    - "Which sellers are underperforming?"

  output:
    required:
      - finding
      - metrics
      - evidence
      - confidence
      - recommendation
